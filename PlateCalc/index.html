<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plate Deflection & Stress Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    p.sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
    }
    legend {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      padding: 0 4px;
    }
    .radio-group {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
    }
    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
    }
    .input-row label { color: var(--text-muted); }
    input[type="number"], select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      width: 110px;
      text-align: right;
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    .results {
      margin-top: 1rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
    svg {
      width: 100%;
      height: 220px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Kirchhoff Plate Deflection & Stress Calculator</h1>
  <p class="sub">Rayleigh-Ritz Method Using Orthogonal Beam Vibration Eigenfunctions.</p>

  <svg id="plate-svg" viewBox="0 0 400 220">
    <rect x="70" y="30" width="260" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="20" text-anchor="middle" fill="#94a3b8" font-size="11" id="lbl-b1">b1 (y = d)</text>
    <text x="200" y="195" text-anchor="middle" fill="#94a3b8" font-size="11" id="lbl-b0">b0 (y = 0)</text>
    <text x="20" y="105" text-anchor="middle" fill="#94a3b8" font-size="11" id="lbl-a0">a0 (x = 0)</text>
    <text x="375" y="105" text-anchor="middle" fill="#94a3b8" font-size="11" id="lbl-a1">a1 (x = L)</text>
    <circle id="load-viz" cx="200" cy="100" r="4" fill="#f43f5e" />
  </svg>

  <div class="grid">
    <div class="panel">
      <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Boundary Conditions</h3>
      
      <fieldset>
        <legend>Edge a0 (x = 0)</legend>
        <div class="radio-group">
          <label><input type="radio" name="a0" value="F"> Free</label>
          <label><input type="radio" name="a0" value="S" checked> Simply Supported</label>
          <label><input type="radio" name="a0" value="C"> Fixed </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Edge a1 (x = L)</legend>
        <div class="radio-group">
          <label><input type="radio" name="a1" value="F"> Free</label>
          <label><input type="radio" name="a1" value="S" checked> Simply Supported</label>
          <label><input type="radio" name="a1" value="C"> Fixed </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Edge b0 (y = 0)</legend>
        <div class="radio-group">
          <label><input type="radio" name="b0" value="F"> Free</label>
          <label><input type="radio" name="b0" value="S" checked> Simply Supported</label>
          <label><input type="radio" name="b0" value="C"> Fixed </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Edge b1 (y = d)</legend>
        <div class="radio-group">
          <label><input type="radio" name="b1" value="F"> Free</label>
          <label><input type="radio" name="b1" value="S" checked> Simply Supported</label>
          <label><input type="radio" name="b1" value="C"> Fixed </label>
        </div>
      </fieldset>

      <div class="input-row" style="margin-top: 1rem;">
        <label>Terms per Axis (N) [higher N yields higher accuracy, but requires more computational power]:</label>
        <input type="number" id="num_modes" value="5" min="2" max="7" step="1">
      </div>
    </div>

    <div class="panel">
      <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Dimensions</h3>
      
      <div class="input-row">
        <label>Length L (in):</label>
        <input type="number" id="len" value="20" min="0.1">
      </div>
      <div class="input-row">
        <label>Width d (in):</label>
        <input type="number" id="wid" value="10" min="0.1">
      </div>
      <div class="input-row">
        <label>Thickness h (in):</label>
        <input type="number" id="thk" value="0.25" min="0.001">
      </div>
      <div class="input-row">
        <label>Young's Modulus E (psi):</label>
        <input type="number" id="mod_e" value="29000000">
      </div>
      <div class="input-row">
        <label>Poisson's Ratio ν:</label>
        <input type="number" id="poi_v" value="0.3" min="0.01" max="0.49" step="0.01">
      </div>

      <div class="input-row" style="margin-top: 0.5rem;">
        <label>Load Type:</label>
        <select id="load_type" onchange="toggleLoadParams()">
          <option value="UDL">Full Uniform (psi)</option>
          <option value="PATCH">Center Patch (psi)</option>
          <option value="POINT">Center Point (lbf)</option>
        </select>
      </div>
      <div class="input-row">
        <label id="load_mag_label">Load Magnitude:</label>
        <input type="number" id="load_mag" value="5">
      </div>
      <div class="input-row" id="patch_dim_row" style="display: none;">
        <label>Patch Size (u × v in):</label>
        <div style="display: flex; gap: 4px;">
          <input type="number" id="patch_u" value="4" style="width: 52px;">
          <input type="number" id="patch_v" value="4" style="width: 52px;">
        </div>
      </div>

      <button onclick="calculatePlate()">Calculate</button>
    </div>
  </div>

  <div class="results" id="output">Ready to Solve.</div>
</div>

<script>
function toggleLoadParams() {
  const type = document.getElementById("load_type").value;
  const patchRow = document.getElementById("patch_dim_row");
  const magLbl = document.getElementById("load_mag_label");
  if (type === "PATCH") {
    patchRow.style.display = "flex";
    magLbl.innerText = "Patch Pressure (psi):";
  } else if (type === "POINT") {
    patchRow.style.display = "none";
    magLbl.innerText = "Point Load P (lbf):";
  } else {
    patchRow.style.display = "none";
    magLbl.innerText = "Uniform Load q (psi):";
  }
}

// 1D Beam Eigenfunction Generator
// Returns { phi(xi), dphi(xi), d2phi(xi) } for standard BC combinations
function getBeamMode(bc0, bc1, m) {
  const combo = bc0 + bc1;
  const n = m + 1; // 1-based index

  if (combo === "SS") {
    const beta = n * Math.PI;
    return (s) => ({
      val: Math.sin(beta * s),
      d1: beta * Math.cos(beta * s),
      d2: -beta * beta * Math.sin(beta * s)
    });
  } 
  
  if (combo === "CC") {
    const betas = [4.73004, 7.85320, 10.9956, 14.1372, 17.2788, 20.4204, 23.5619];
    const beta = n <= betas.length ? betas[n - 1] : (n + 0.5) * Math.PI;
    const alpha = (Math.cosh(beta) - Math.cos(beta)) / (Math.sinh(beta) - Math.sin(beta));
    return (s) => {
      const bs = beta * s;
      return {
        val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
        d1: beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
        d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
      };
    };
  }

  if (combo === "CS" || combo === "SC") {
    const betas = [3.9266, 7.0686, 10.2102, 13.3518, 16.4934, 19.6350];
    const beta = n <= betas.length ? betas[n - 1] : (n + 0.25) * Math.PI;
    const alpha = (Math.cosh(beta) - Math.cos(beta)) / (Math.sinh(beta) - Math.sin(beta));
    if (combo === "CS") {
      return (s) => {
        const bs = beta * s;
        return {
          val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
          d1: beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
          d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
        };
      };
    } else {
      return (s) => {
        const bs = beta * (1 - s);
        return {
          val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
          d1: -beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
          d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
        };
      };
    }
  }

  if (combo === "CF" || combo === "FC") {
    const betas = [1.8751, 4.6941, 7.8548, 10.9955, 14.1372];
    const beta = n <= betas.length ? betas[n - 1] : (n - 0.5) * Math.PI;
    const alpha = (Math.sinh(beta) - Math.sin(beta)) / (Math.cosh(beta) + Math.cos(beta));
    if (combo === "CF") {
      return (s) => {
        const bs = beta * s;
        return {
          val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
          d1: beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
          d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
        };
      };
    } else {
      return (s) => {
        const bs = beta * (1 - s);
        return {
          val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
          d1: -beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
          d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
        };
      };
    }
  }

  // Fallback / Free-Free (unsupported side combinations utilize trigonometric polynomial augmentation)
  const beta = n * Math.PI;
  return (s) => ({
    val: Math.cos(beta * s),
    d1: -beta * Math.sin(beta * s),
    d2: -beta * beta * Math.cos(beta * s)
  });
}

// 8-point Gauss-Legendre Quadrature
const GAUSS_PTS = [-0.9602898565, -0.7966664774, -0.5255324099, -0.1834346425, 0.1834346425, 0.5255324099, 0.7966664774, 0.9602898565];
const GAUSS_WTS = [0.1012285363, 0.2223810345, 0.3137066459, 0.3626837834, 0.3626837834, 0.3137066459, 0.2223810345, 0.1012285363];

function solveLinearSystem(A, b) {
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let max = i;
    for (let k = i + 1; k < n; k++) {
      if (Math.abs(A[k][i]) > Math.abs(A[max][i])) max = k;
    }
    const tmpA = A[i]; A[i] = A[max]; A[max] = tmpA;
    const tmpB = b[i]; b[i] = b[max]; b[max] = tmpB;

    if (Math.abs(A[i][i]) < 1e-12) return null; // Singularity

    for (let k = i + 1; k < n; k++) {
      const c = A[k][i] / A[i][i];
      for (let j = i; j < n; j++) A[k][j] -= c * A[i][j];
      b[k] -= c * b[i];
    }
  }
  const x = new Array(n);
  for (let i = n - 1; i >= 0; i--) {
    let sum = 0;
    for (let j = i + 1; j < n; j++) sum += A[i][j] * x[j];
    x[i] = (b[i] - sum) / A[i][i];
  }
  return x;
}

function calculatePlate() {
  const out = document.getElementById("output");
  const a0 = document.querySelector("input[name='a0']:checked").value;
  const a1 = document.querySelector("input[name='a1']:checked").value;
  const b0 = document.querySelector("input[name='b0']:checked").value;
  const b1 = document.querySelector("input[name='b1']:checked").value;

  const freeEdges = [a0, a1, b0, b1].filter(x => x === 'F').length;
  if (freeEdges >= 3) {
    out.innerText = "Error: Plate is statically determinate or unstable (≥ 3 free edges). Must have at least 2 restrained edges.";
    return;
  }

  const L = parseFloat(document.getElementById("len").value);
  const d = parseFloat(document.getElementById("wid").value);
  const h = parseFloat(document.getElementById("thk").value);
  const E = parseFloat(document.getElementById("mod_e").value);
  const v = parseFloat(document.getElementById("poi_v").value);
  const N = parseInt(document.getElementById("num_modes").value);
  const loadType = document.getElementById("load_type").value;
  const loadMag = parseFloat(document.getElementById("load_mag").value);

  const D = (E * Math.pow(h, 3)) / (12 * (1 - v * v));
  const totalModes = N * N;

  // Build basis function handles
  const X_modes = [];
  const Y_modes = [];
  for (let m = 0; m < N; m++) {
    X_modes.push(getBeamMode(a0, a1, m));
    Y_modes.push(getBeamMode(b0, b1, m));
  }

  // Pre-evaluate modes at Gauss quadrature points
  const nGP = 8;
  const xi_pts = GAUSS_PTS.map(p => 0.5 * (p + 1.0));
  const xi_wts = GAUSS_WTS.map(w => 0.5 * w);

  const X_eval = Array.from({length: N}, () => new Array(nGP));
  const Y_eval = Array.from({length: N}, () => new Array(nGP));

  for (let i = 0; i < N; i++) {
    for (let g = 0; g < nGP; g++) {
      const rx = X_modes[i](xi_pts[g]);
      X_eval[i][g] = { val: rx.val, d1: rx.d1 / L, d2: rx.d2 / (L * L) };

      const ry = Y_modes[i](xi_pts[g]);
      Y_eval[i][g] = { val: ry.val, d1: ry.d1 / d, d2: ry.d2 / (d * d) };
    }
  }

  // Assemble Stiffness Matrix K and Force Vector F
  const K = Array.from({length: totalModes}, () => new Float64Array(totalModes));
  const F = new Float64Array(totalModes);
  const detA = L * d;

  const patchU = parseFloat(document.getElementById("patch_u")?.value || 0) / L;
  const patchV = parseFloat(document.getElementById("patch_v")?.value || 0) / d;

  for (let r = 0; r < totalModes; r++) {
    const ir = Math.floor(r / N);
    const jr = r % N;

    // Load vector integral
    if (loadType === "POINT") {
      // Evaluated at plate center (xi = 0.5, eta = 0.5)
      const phix = X_modes[ir](0.5).val;
      const phiy = Y_modes[jr](0.5).val;
      F[r] = loadMag * phix * phiy;
    } else if (loadType === "PATCH") {
      let int_x = 0, int_y = 0;
      for (let g = 0; g < nGP; g++) {
        const x_coord = 0.5 - patchU/2 + xi_pts[g] * patchU;
        const y_coord = 0.5 - patchV/2 + xi_pts[g] * patchV;
        int_x += xi_wts[g] * patchU * X_modes[ir](x_coord).val;
        int_y += xi_wts[g] * patchV * Y_modes[jr](y_coord).val;
      }
      F[r] = loadMag * detA * int_x * int_y;
    } else {
      // Full UDL
      let int_x = 0, int_y = 0;
      for (let g = 0; g < nGP; g++) {
        int_x += xi_wts[g] * X_eval[ir][g].val;
        int_y += xi_wts[g] * Y_eval[jr][g].val;
      }
      F[r] = loadMag * detA * int_x * int_y;
    }

    for (let c = r; c < totalModes; c++) {
      const ic = Math.floor(c / N);
      const jc = c % N;

      let I_xx_xx = 0, I_0_0_x = 0, I_xx_0_x = 0, I_0_xx_x = 0, I_x_x_x = 0;
      let I_0_0_y = 0, I_yy_yy = 0, I_0_yy_y = 0, I_yy_0_y = 0, I_y_y_y = 0;

      for (let g = 0; g < nGP; g++) {
        const wx = xi_wts[g];
        const Xr = X_eval[ir][g];
        const Xc = X_eval[ic][g];
        I_xx_xx += wx * Xr.d2 * Xc.d2;
        I_0_0_x += wx * Xr.val * Xc.val;
        I_xx_0_x += wx * Xr.d2 * Xc.val;
        I_0_xx_x += wx * Xr.val * Xc.d2;
        I_x_x_x += wx * Xr.d1 * Xc.d1;

        const wy = xi_wts[g];
        const Yr = Y_eval[jr][g];
        const Yc = Y_eval[jc][g];
        I_0_0_y += wy * Yr.val * Yc.val;
        I_yy_yy += wy * Yr.d2 * Yc.d2;
        I_yy_0_y += wy * Yr.d2 * Yc.val;
        I_0_yy_y += wy * Yr.val * Yc.d2;
        I_y_y_y += wy * Yr.d1 * Yc.d1;
      }

      const t1 = I_xx_xx * I_0_0_y;
      const t2 = I_0_0_x * I_yy_yy;
      const t3 = v * I_xx_0_x * I_0_yy_y;
      const t4 = v * I_0_xx_x * I_yy_0_y;
      const t5 = 2.0 * (1.0 - v) * I_x_x_x * I_y_y_y;

      const kval = D * detA * (t1 + t2 + t3 + t4 + t5);
      K[r][c] = kval;
      K[c][r] = kval;
    }
  }

  // Solve linear system
  const coefs = solveLinearSystem(K, F);
  if (!coefs) {
    out.innerText = "Numerical singularity in stiffness matrix. Increase constraint support.";
    return;
  }

  // Evaluate max deflection and stresses across a 25x25 grid
  const steps = 25;
  let maxW = 0, maxVM = 0;
  let locW = {x: 0, y: 0}, locVM = {x: 0, y: 0};

  for (let ix = 0; ix <= steps; ix++) {
    const s_x = ix / steps;
    const x = s_x * L;
    for (let iy = 0; iy <= steps; iy++) {
      const s_y = iy / steps;
      const y = s_y * d;

      let w = 0, w_xx = 0, w_yy = 0, w_xy = 0;

      for (let r = 0; r < totalModes; r++) {
        const ir = Math.floor(r / N);
        const jr = r % N;
        const c = coefs[r];
        if (Math.abs(c) < 1e-15) continue;

        const rx = X_modes[ir](s_x);
        const ry = Y_modes[jr](s_y);

        w += c * rx.val * ry.val;
        w_xx += c * (rx.d2 / (L * L)) * ry.val;
        w_yy += c * rx.val * (ry.d2 / (d * d));
        w_xy += c * (rx.d1 / L) * (ry.d1 / d);
      }

      if (Math.abs(w) > maxW) {
        maxW = Math.abs(w);
        locW = {x, y};
      }

      const Mx = -D * (w_xx + v * w_yy);
      const My = -D * (w_yy + v * w_xx);
      const Mxy = -D * (1 - v) * w_xy;

      const sig_x = 6 * Math.abs(Mx) / (h * h);
      const sig_y = 6 * Math.abs(My) / (h * h);
      const tau = 6 * Math.abs(Mxy) / (h * h);

      const vm = Math.sqrt(sig_x * sig_x - sig_x * sig_y + sig_y * sig_y + 3 * tau * tau);
      if (vm > maxVM) {
        maxVM = vm;
        locVM = {x, y};
      }
    }
  }

  out.innerText = 
    `Rigidity D:               ${D.toExponential(3)} lb·in\n` +
    `Max Deflection (w_max):   ${maxW.toFixed(5)} in  at (x=${locW.x.toFixed(2)}, y=${locW.y.toFixed(2)})\n` +
    `Max Von Mises Stress:     ${maxVM.toFixed(1)} psi  at (x=${locVM.x.toFixed(2)}, y=${locVM.y.toFixed(2)})\n\n` +
    `Status: Admissible boundary modes converged smoothly using N=${N} (${totalModes} total terms).`;
}
</script>
</body>
</html>
