<script type="py">
from pyscript import document
import numpy as np
import sympy as sp

def calculate_answer(event):
    out = document.querySelector("#output-box")
    out.innerText = "Calculating... Please wait."

    try:
        a0 = float(document.querySelector("input[name='a0']:checked").value)
        a1 = float(document.querySelector("input[name='a1']:checked").value)
        b0 = float(document.querySelector("input[name='b0']:checked").value)
        b1 = float(document.querySelector("input[name='b1']:checked").value)
        # Geometry & material inputs
        h = float(document.querySelector("#thickness").value)
        l = float(document.querySelector("#length").value)
        d = float(document.querySelector("#width").value)
        Y = float(document.querySelector("#E").value)
        v = float(document.querySelector("#v").value)
        q = float(document.querySelector("#q").value)
    except Exception as err:
        out.innerText = f"Input Error: {err}"
        return

    if l <= 0 or d <= 0 or h <= 0 or Y <= 0 or (1 - v**2) == 0:
        out.innerText = "Please enter valid, non-zero values for Length, Width, Thickness, and E."
        return

    # Use smaller grid for fast in-browser symbolic integration (M=3, N=3)
    M, N = 3, 3
    x, y = sp.symbols('x y', real=True)
    D = Y * h**3 / (12 * (1 - v**2))

    def X(i, x, l):
        return (x/l)**a0 * (1 - x/l)**a1 * (x/l)**i

    def Y_fn(j, y, d):
        return (y/d)**b0 * (1 - y/d)**b1 * (y/d)**j

    phi = [X(i, x, l) * Y_fn(j, y, d) for i in range(1, M + 1) for j in range(1, N + 1)]
    c = sp.symbols(f'c0:{M*N}')
    w = sum(ci * p for ci, p in zip(c, phi))

    w_xx = sp.diff(w, x, 2)
    w_yy = sp.diff(w, y, 2)
    w_xy = sp.diff(w, x, y)

    U = (D / 2) * sp.integrate((w_xx + w_yy)**2 - 2*(1 - v)*(w_xx*w_yy - w_xy**2), (x, 0, l), (y, 0, d))
    V = -sp.integrate(q * w, (x, 0, l), (y, 0, d))

    eqns = [sp.diff(U + V, ci) for ci in c]
    sol = sp.solve(eqns, c, dict=True)[0]
    w_sol = w.subs(sol)

    # Stress expressions
    w_xx_sol = sp.diff(w_sol, x, 2)
    w_yy_sol = sp.diff(w_sol, y, 2)
    w_xy_sol = sp.diff(w_sol, x, y)

    Mx = -D * (w_xx_sol + v * w_yy_sol)
    My = -D * (w_yy_sol + v * w_xx_sol)
    Mxy = -D * (1 - v) * w_xy_sol

    w_fn = sp.lambdify((x, y), w_sol, 'numpy')
    sx_fn = sp.lambdify((x, y), 6 * Mx / h**2, 'numpy')
    sy_fn = sp.lambdify((x, y), 6 * My / h**2, 'numpy')
    txy_fn = sp.lambdify((x, y), 6 * Mxy / h**2, 'numpy')

    xs = np.linspace(0, l, 25)
    ys = np.linspace(0, d, 25)
    Xg, Yg = np.meshgrid(xs, ys)

    wg = w_fn(Xg, Yg)
    sx = sx_fn(Xg, Yg)
    sy = sy_fn(Xg, Yg)
    txy = txy_fn(Xg, Yg)

    # Correct Von Mises stress formula including torsion
    vmg = np.sqrt(sx**2 - sx*sy + sy**2 + 3 * txy**2)

    max_w_idx = np.unravel_index(np.argmax(np.abs(wg)), wg.shape)
    max_vm_idx = np.unravel_index(np.argmax(vmg), vmg.shape)

    out.innerText = (
        f"Max Deflection: {wg[max_w_idx]:.5f} in at ({Xg[max_w_idx]:.2f}, {Yg[max_w_idx]:.2f})\n"
        f"Max Von Mises Stress: {vmg[max_vm_idx]:.2f} psi at ({Xg[max_vm_idx]:.2f}, {Yg[max_vm_idx]:.2f})"
    )
</script>
