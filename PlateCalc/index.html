<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- setting up color scheme, and visualization of plate -->
  <!-- visualization centered and has width constraint -->
  <title>Plate Deflection & Stress Calculator</title>
  <style>
    :root {
      --bg: #647400;
      --card: #fcf8f3;
      --border: #ffd3b6;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text: #647400;
      --text-muted: #64748b;
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem;
      line-height: 1.5;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; color: #fff; }
    p.sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.6rem;
    }
    legend {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      padding: 0 4px;
    }
    .radio-group {
      display: flex;
      gap: 0.75rem;
      font-size: 0.85rem;
    }
    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }
    .input-row label { color: var(--text-muted); }
    input[type="number"], select {
      background: (--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      width: 105px;
      text-align: right;
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    .results {
      margin-top: 1rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      color: #e2e8f0;
    }
    .error-msg {
      color: #f87171 !important;
      font-weight: 600;
    }
    svg {
      width: 100%;
      height: 180px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Plate Deflection & Stress Calculator</h1>
  <p class="sub">Based on Kirchoff-Love Plate Hypothesis and Rayleigh-Ritz Formulation</p>

  <!-- Interactive Visualizer -->
  <svg id="plate-svg" viewBox="0 0 400 180">
    <rect id="svg-plate" x="80" y="25" width="240" height="130" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="16" text-anchor="middle" fill="#94a3b8" font-size="11" id="lbl-b1">b1 (y = d)</text>
    <text x="200" y="172" text-anchor="middle" fill="#94a3b8" font-size="11" id="lbl-b0">b0 (y = 0)</text>
    <text x="30" y="93" text-anchor="middle" fill="#94a3b8" font-size="11" id="lbl-a0">a0 (x = 0)</text>
    <text x="365" y="93" text-anchor="middle" fill="#94a3b8" font-size="11" id="lbl-a1">a1 (x = L)</text>
    
    <!-- Load visualization elements -->
    <rect id="svg-patch" x="180" y="70" width="40" height="40" fill="#f43f5e" opacity="0.4" stroke="#f43f5e" stroke-width="1.5" style="display:none;"/>
    <circle id="svg-point" cx="200" cy="90" r="5" fill="#f43f5e" stroke="#fff" stroke-width="1.5" style="display:none;"/>
  </svg>

  <div class="grid">
    <!-- Boundary Conditions -->
    <div class="panel">
      <h3 style="font-size: 0.95rem; margin-bottom: 0.6rem;">Boundary Conditions</h3>
      
      <fieldset>
        <legend>Edge a0 (x = 0)</legend>
        <div class="radio-group">
          <label><input type="radio" name="a0" value="F"> Free</label>
          <label><input type="radio" name="a0" value="S" checked> Simply Supported</label>
          <label><input type="radio" name="a0" value="C"> Fixed / Clamped</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Edge a1 (x = L)</legend>
        <div class="radio-group">
          <label><input type="radio" name="a1" value="F"> Free</label>
          <label><input type="radio" name="a1" value="S" checked> Simply Supported</label>
          <label><input type="radio" name="a1" value="C"> Fixed / Clamped</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Edge b0 (y = 0)</legend>
        <div class="radio-group">
          <label><input type="radio" name="b0" value="F"> Free</label>
          <label><input type="radio" name="b0" value="S" checked> Simply Supported</label>
          <label><input type="radio" name="b0" value="C"> Fixed / Clamped</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Edge b1 (y = d)</legend>
        <div class="radio-group">
          <label><input type="radio" name="b1" value="F"> Free</label>
          <label><input type="radio" name="b1" value="S" checked> Simply Supported</label>
          <label><input type="radio" name="b1" value="C"> Fixed / Clamped</label>
        </div>
      </fieldset>

      <div class="input-row" style="margin-top: 0.8rem;">
        <label>Terms per Axis (N):</label>
        <input type="number" id="num_modes" value="5" min="2" max="6" step="1">
      </div>
    </div>

    <!-- Dimensions & Loading -->
    <div class="panel">
      <h3 style="font-size: 0.95rem; margin-bottom: 0.6rem;">Plate Dimensions and Loading Conditions</h3>
      
      <div class="input-row">
        <label>Length L (in):</label>
        <input type="number" id="len" value="20" min="0.1">
      </div>
      <div class="input-row">
        <label>Width d (in):</label>
        <input type="number" id="wid" value="10" min="0.1">
      </div>
      <div class="input-row">
        <label>Thickness h (in):</label>
        <input type="number" id="thk" value="0.25" min="0.001">
      </div>
      <div class="input-row">
        <label>Young's Modulus E (psi):</label>
        <input type="number" id="mod_e" value="29000000">
      </div>
      <div class="input-row">
        <label>Poisson's Ratio ν:</label>
        <input type="number" id="poi_v" value="0.3" min="0.01" max="0.49" step="0.01">
      </div>

      <div class="input-row" style="margin-top: 0.6rem;">
        <label>Load Type:</label>
        <select id="load_type" onchange="updateLoadUI()">
          <option value="UDL">Full Uniform (UDL)</option>
          <option value="TRAP_X">Trapezoidal / Triangular (along x)</option>
          <option value="TRAP_Y">Trapezoidal / Triangular (along y)</option>
          <option value="PATCH">Partial Area (Patch)</option>
          <option value="POINT">Point Load</option>
        </select>
      </div>

      <!-- Magnitude Field -->
      <div class="input-row" id="row_q0">
        <label id="lbl_q0">Pressure q (psi):</label>
        <input type="number" id="load_q0" value="5">
      </div>

      <!-- Secondary Magnitude Field (for Trapezoid/Triangle) -->
      <div class="input-row" id="row_q1" style="display: none;">
        <label id="lbl_q1">End Pressure q1 (at edge, psi):</label>
        <input type="number" id="load_q1" value="0">
      </div>

      <!-- Patch Dimensions (u x v) -->
      <div class="input-row" id="row_patch_dim" style="display: none;">
        <label>Patch Size u × v (in):</label>
        <div style="display: flex; gap: 4px;">
          <input type="number" id="patch_u" value="4" style="width: 50px;">
          <input type="number" id="patch_v" value="4" style="width: 50px;">
        </div>
      </div>

      <!-- Center Coordinates (x0, y0) for Patch or Point -->
      <div class="input-row" id="row_coords" style="display: none;">
        <label id="lbl_coords">Load Location (x, y in):</label>
        <div style="display: flex; gap: 4px;">
          <input type="number" id="coord_x" value="10" style="width: 50px;">
          <input type="number" id="coord_y" value="5" style="width: 50px;">
        </div>
      </div>

      <button id="calc-btn" onclick="calculatePlate()">Calculate</button>
    </div>
  </div>

  <div class="results" id="output">Ready. Click "Calculate" to begin.</div>
</div>

<script>
function updateLoadUI() {
  const type = document.getElementById("load_type").value;
  const rowQ0 = document.getElementById("row_q0");
  const lblQ0 = document.getElementById("lbl_q0");
  const rowQ1 = document.getElementById("row_q1");
  const rowPatchDim = document.getElementById("row_patch_dim");
  const rowCoords = document.getElementById("row_coords");
  const lblCoords = document.getElementById("lbl_coords");

  const svgPatch = document.getElementById("svg-patch");
  const svgPoint = document.getElementById("svg-point");

  // Reset defaults
  rowQ1.style.display = "none";
  rowPatchDim.style.display = "none";
  rowCoords.style.display = "none";
  svgPatch.style.display = "none";
  svgPoint.style.display = "none";

  if (type === "UDL") {
    lblQ0.innerText = "Uniform Pressure q (psi):";
  } else if (type === "TRAP_X") {
    rowQ1.style.display = "flex";
    lblQ0.innerText = "Start Pressure q0 (at x=0, psi):";
    document.getElementById("lbl_q1").innerText = "End Pressure q1 (at x=L, psi):";
  } else if (type === "TRAP_Y") {
    rowQ1.style.display = "flex";
    lblQ0.innerText = "Start Pressure q0 (at y=0, psi):";
    document.getElementById("lbl_q1").innerText = "End Pressure q1 (at y=d, psi):";
  } else if (type === "PATCH") {
    lblQ0.innerText = "Patch Pressure q (psi):";
    rowPatchDim.style.display = "flex";
    rowCoords.style.display = "flex";
    lblCoords.innerText = "Patch Center (x, y in):";
    svgPatch.style.display = "block";
  } else if (type === "POINT") {
    lblQ0.innerText = "Point Load P (lbf):";
    rowCoords.style.display = "flex";
    lblCoords.innerText = "Point Location (x, y in):";
    svgPoint.style.display = "block";
  }
}

// Beam Eigenfunctions with exact derivatives
function getBeamMode(bc0, bc1, m) {
  const combo = bc0 + bc1;
  const n = m + 1;

  if (combo === "SS") {
    const beta = n * Math.PI;
    return (s) => ({
      val: Math.sin(beta * s),
      d1: beta * Math.cos(beta * s),
      d2: -beta * beta * Math.sin(beta * s)
    });
  } 
  
  if (combo === "CC") {
    const betas = [4.73004, 7.85320, 10.9956, 14.1372, 17.2788, 20.4204];
    const beta = n <= betas.length ? betas[n - 1] : (n + 0.5) * Math.PI;
    const alpha = (Math.cosh(beta) - Math.cos(beta)) / (Math.sinh(beta) - Math.sin(beta));
    return (s) => {
      const bs = beta * s;
      return {
        val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
        d1: beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
        d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
      };
    };
  }

  if (combo === "CS" || combo === "SC") {
    const betas = [3.9266, 7.0686, 10.2102, 13.3518, 16.4934];
    const beta = n <= betas.length ? betas[n - 1] : (n + 0.25) * Math.PI;
    const alpha = (Math.cosh(beta) - Math.cos(beta)) / (Math.sinh(beta) - Math.sin(beta));
    if (combo === "CS") {
      return (s) => {
        const bs = beta * s;
        return {
          val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
          d1: beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
          d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
        };
      };
    } else {
      return (s) => {
        const bs = beta * (1 - s);
        return {
          val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
          d1: -beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
          d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
        };
      };
    }
  }

  if (combo === "CF" || combo === "FC") {
    const betas = [1.8751, 4.6941, 7.8548, 10.9955, 14.1372];
    const beta = n <= betas.length ? betas[n - 1] : (n - 0.5) * Math.PI;
    const alpha = (Math.sinh(beta) - Math.sin(beta)) / (Math.cosh(beta) + Math.cos(beta));
    if (combo === "CF") {
      return (s) => {
        const bs = beta * s;
        return {
          val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
          d1: beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
          d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
        };
      };
    } else {
      return (s) => {
        const bs = beta * (1 - s);
        return {
          val: Math.cosh(bs) - Math.cos(bs) - alpha * (Math.sinh(bs) - Math.sin(bs)),
          d1: -beta * (Math.sinh(bs) + Math.sin(bs) - alpha * (Math.cosh(bs) - Math.cos(bs))),
          d2: beta * beta * (Math.cosh(bs) + Math.cos(bs) - alpha * (Math.sinh(bs) + Math.sin(bs)))
        };
      };
    }
  }

  // Free-Free fallback
  const beta = n * Math.PI;
  return (s) => ({
    val: Math.cos(beta * s),
    d1: -beta * Math.sin(beta * s),
    d2: -beta * beta * Math.cos(beta * s)
  });
}

// 8-point Gauss-Legendre Quadrature
const GAUSS_PTS = [-0.9602898565, -0.7966664774, -0.5255324099, -0.1834346425, 0.1834346425, 0.5255324099, 0.7966664774, 0.9602898565];
const GAUSS_WTS = [0.1012285363, 0.2223810345, 0.3137066459, 0.3626837834, 0.3626837834, 0.3137066459, 0.2223810345, 0.1012285363];

function solveLinearSystem(A, b) {
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let max = i;
    for (let k = i + 1; k < n; k++) {
      if (Math.abs(A[k][i]) > Math.abs(A[max][i])) max = k;
    }
    const tmpA = A[i]; A[i] = A[max]; A[max] = tmpA;
    const tmpB = b[i]; b[i] = b[max]; b[max] = tmpB;

    if (Math.abs(A[i][i]) < 1e-12) return null;

    for (let k = i + 1; k < n; k++) {
      const c = A[k][i] / A[i][i];
      for (let j = i; j < n; j++) A[k][j] -= c * A[i][j];
      b[k] -= c * b[i];
    }
  }
  const x = new Array(n);
  for (let i = n - 1; i >= 0; i--) {
    let sum = 0;
    for (let j = i + 1; j < n; j++) sum += A[i][j] * x[j];
    x[i] = (b[i] - sum) / A[i][i];
  }
  return x;
}

function calculatePlate() {
  const out = document.getElementById("output");
  out.className = "results";
  out.innerText = "Computing... please wait.";

  try {
    const a0 = document.querySelector("input[name='a0']:checked").value;
    const a1 = document.querySelector("input[name='a1']:checked").value;
    const b0 = document.querySelector("input[name='b0']:checked").value;
    const b1 = document.querySelector("input[name='b1']:checked").value;

    const freeEdges = [a0, a1, b0, b1].filter(x => x === 'F').length;
    if (freeEdges >= 3) {
      out.className = "results error-msg";
      out.innerText = "Error: Plate is unstable (≥ 3 free edges). Rigid body motion will occur.";
      return;
    }

    const L = parseFloat(document.getElementById("len").value);
    const d = parseFloat(document.getElementById("wid").value);
    const h = parseFloat(document.getElementById("thk").value);
    const E = parseFloat(document.getElementById("mod_e").value);
    const v = parseFloat(document.getElementById("poi_v").value);
    const N = parseInt(document.getElementById("num_modes").value);

    const loadType = document.getElementById("load_type").value;
    const q0 = parseFloat(document.getElementById("load_q0").value);
    const q1El = document.getElementById("load_q1");
    const q1 = (loadType.startsWith("TRAP") && q1El) ? parseFloat(q1El.value) : q0;

    const patchU = parseFloat(document.getElementById("patch_u")?.value || 0);
    const patchV = parseFloat(document.getElementById("patch_v")?.value || 0);
    const coordX = parseFloat(document.getElementById("coord_x")?.value || L/2);
    const coordY = parseFloat(document.getElementById("coord_y")?.value || d/2);

    if (L <= 0 || d <= 0 || h <= 0 || E <= 0) {
      out.className = "results error-msg";
      out.innerText = "Error: Dimensions and material modulus must be strictly positive.";
      return;
    }

    // Update SVG visualizer
    const pW = 240, pH = 130, pX = 80, pY = 25;
    if (loadType === "POINT") {
      const cx = pX + (coordX / L) * pW;
      const cy = pY + (1.0 - coordY / d) * pH;
      const pt = document.getElementById("svg-point");
      pt.setAttribute("cx", Math.max(pX, Math.min(pX + pW, cx)));
      pt.setAttribute("cy", Math.max(pY, Math.min(pY + pH, cy)));
    } else if (loadType === "PATCH") {
      const pw = (patchU / L) * pW;
      const ph = (patchV / d) * pH;
      const px = pX + ((coordX - patchU/2) / L) * pW;
      const py = pY + (1.0 - (coordY + patchV/2) / d) * pH;
      const pt = document.getElementById("svg-patch");
      pt.setAttribute("x", px);
      pt.setAttribute("y", py);
      pt.setAttribute("width", pw);
      pt.setAttribute("height", ph);
    }

    const D = (E * Math.pow(h, 3)) / (12 * (1 - v * v));
    const totalModes = N * N;

    // Basis functions
    const X_modes = [];
    const Y_modes = [];
    for (let m = 0; m < N; m++) {
      X_modes.push(getBeamMode(a0, a1, m));
      Y_modes.push(getBeamMode(b0, b1, m));
    }

    const nGP = 8;
    const xi_pts = GAUSS_PTS.map(p => 0.5 * (p + 1.0));
    const xi_wts = GAUSS_WTS.map(w => 0.5 * w);

    const X_eval = Array.from({length: N}, () => new Array(nGP));
    const Y_eval = Array.from({length: N}, () => new Array(nGP));

    for (let i = 0; i < N; i++) {
      for (let g = 0; g < nGP; g++) {
        const rx = X_modes[i](xi_pts[g]);
        X_eval[i][g] = { val: rx.val, d1: rx.d1 / L, d2: rx.d2 / (L * L) };

        const ry = Y_modes[i](xi_pts[g]);
        Y_eval[i][g] = { val: ry.val, d1: ry.d1 / d, d2: ry.d2 / (d * d) };
      }
    }

    const K = Array.from({length: totalModes}, () => new Float64Array(totalModes));
    const F = new Float64Array(totalModes);
    const detA = L * d;

    // Force vector integration
    for (let r = 0; r < totalModes; r++) {
      const ir = Math.floor(r / N);
      const jr = r % N;

      if (loadType === "POINT") {
        // Dirac delta evaluated at (coordX, coordY)
        const xi_p = Math.min(1.0, Math.max(0.0, coordX / L));
        const eta_p = Math.min(1.0, Math.max(0.0, coordY / d));
        const phix = X_modes[ir](xi_p).val;
        const phiy = Y_modes[jr](eta_p).val;
        F[r] = q0 * phix * phiy;

      } else if (loadType === "PATCH") {
        // Integrate over patch sub-domain [x1, x2] x [y1, y2]
        const xi_start = Math.max(0.0, (coordX - patchU / 2) / L);
        const xi_end = Math.min(1.0, (coordX + patchU / 2) / L);
        const d_xi = xi_end - xi_start;

        const eta_start = Math.max(0.0, (coordY - patchV / 2) / d);
        const eta_end = Math.min(1.0, (coordY + patchV / 2) / d);
        const d_eta = eta_end - eta_start;

        let int_x = 0, int_y = 0;
        for (let g = 0; g < nGP; g++) {
          const pt_x = xi_start + xi_pts[g] * d_xi;
          const pt_y = eta_start + xi_pts[g] * d_eta;
          int_x += xi_wts[g] * d_xi * X_modes[ir](pt_x).val;
          int_y += xi_wts[g] * d_eta * Y_modes[jr](pt_y).val;
        }
        F[r] = q0 * detA * int_x * int_y;

      } else if (loadType === "TRAP_X") {
        let int_x = 0, int_y = 0;
        for (let g = 0; g < nGP; g++) {
          const xi = xi_pts[g];
          const q_xi = q0 + (q1 - q0) * xi;
          int_x += xi_wts[g] * q_xi * X_eval[ir][g].val;
          int_y += xi_wts[g] * Y_eval[jr][g].val;
        }
        F[r] = detA * int_x * int_y;

      } else if (loadType === "TRAP_Y") {
        let int_x = 0, int_y = 0;
        for (let g = 0; g < nGP; g++) {
          const eta = xi_pts[g];
          const q_eta = q0 + (q1 - q0) * eta;
          int_x += xi_wts[g] * X_eval[ir][g].val;
          int_y += xi_wts[g] * q_eta * Y_eval[jr][g].val;
        }
        F[r] = detA * int_x * int_y;

      } else {
        // Uniform Area (UDL)
        let int_x = 0, int_y = 0;
        for (let g = 0; g < nGP; g++) {
          int_x += xi_wts[g] * X_eval[ir][g].val;
          int_y += xi_wts[g] * Y_eval[jr][g].val;
        }
        F[r] = q0 * detA * int_x * int_y;
      }

      // Stiffness Matrix K Assembly
      for (let c = r; c < totalModes; c++) {
        const ic = Math.floor(c / N);
        const jc = c % N;

        let I_xx_xx = 0, I_0_0_x = 0, I_xx_0_x = 0, I_0_xx_x = 0, I_x_x_x = 0;
        let I_0_0_y = 0, I_yy_yy = 0, I_0_yy_y = 0, I_yy_0_y = 0, I_y_y_y = 0;

        for (let g = 0; g < nGP; g++) {
          const wx = xi_wts[g];
          const Xr = X_eval[ir][g];
          const Xc = X_eval[ic][g];
          I_xx_xx += wx * Xr.d2 * Xc.d2;
          I_0_0_x += wx * Xr.val * Xc.val;
          I_xx_0_x += wx * Xr.d2 * Xc.val;
          I_0_xx_x += wx * Xr.val * Xc.d2;
          I_x_x_x += wx * Xr.d1 * Xc.d1;

          const wy = xi_wts[g];
          const Yr = Y_eval[jr][g];
          const Yc = Y_eval[jc][g];
          I_0_0_y += wy * Yr.val * Yc.val;
          I_yy_yy += wy * Yr.d2 * Yc.d2;
          I_yy_0_y += wy * Yr.d2 * Yc.val;
          I_0_yy_y += wy * Yr.val * Yc.d2;
          I_y_y_y += wy * Yr.d1 * Yc.d1;
        }

        const t1 = I_xx_xx * I_0_0_y;
        const t2 = I_0_0_x * I_yy_yy;
        const t3 = v * I_xx_0_x * I_0_yy_y;
        const t4 = v * I_0_xx_x * I_yy_0_y;
        const t5 = 2.0 * (1.0 - v) * I_x_x_x * I_y_y_y;

        const kval = D * detA * (t1 + t2 + t3 + t4 + t5);
        K[r][c] = kval;
        K[c][r] = kval;
      }
    }

    const coefs = solveLinearSystem(K, F);
    if (!coefs) {
      out.className = "results error-msg";
      out.innerText = "Error: Numerical singularity. Check support conditions.";
      return;
    }

    // Grid search for maximums
    const steps = 30;
    let maxW = 0, maxVM = 0;
    let locW = {x: 0, y: 0}, locVM = {x: 0, y: 0};

    for (let ix = 0; ix <= steps; ix++) {
      const s_x = ix / steps;
      const x = s_x * L;
      for (let iy = 0; iy <= steps; iy++) {
        const s_y = iy / steps;
        const y = s_y * d;

        let w = 0, w_xx = 0, w_yy = 0, w_xy = 0;

        for (let r = 0; r < totalModes; r++) {
          const ir = Math.floor(r / N);
          const jr = r % N;
          const c = coefs[r];
          if (Math.abs(c) < 1e-15) continue;

          const rx = X_modes[ir](s_x);
          const ry = Y_modes[jr](s_y);

          w += c * rx.val * ry.val;
          w_xx += c * (rx.d2 / (L * L)) * ry.val;
          w_yy += c * rx.val * (ry.d2 / (d * d));
          w_xy += c * (rx.d1 / L) * (ry.d1 / d);
        }

        if (Math.abs(w) > maxW) {
          maxW = Math.abs(w);
          locW = {x, y};
        }

        const Mx = -D * (w_xx + v * w_yy);
        const My = -D * (w_yy + v * w_xx);
        const Mxy = -D * (1 - v) * w_xy;

        const sig_x = 6 * Math.abs(Mx) / (h * h);
        const sig_y = 6 * Math.abs(My) / (h * h);
        const tau = 6 * Math.abs(Mxy) / (h * h);

        const vm = Math.sqrt(sig_x * sig_x - sig_x * sig_y + sig_y * sig_y + 3 * tau * tau);
        if (vm > maxVM) {
          maxVM = vm;
          locVM = {x, y};
        }
      }
    }

    out.innerText = 
      `Plate Rigidity D:       ${D.toExponential(3)} lb·in\n` +
      `Max Deflection:         ${maxW.toFixed(5)} in  at (x = ${locW.x.toFixed(2)}, y = ${locW.y.toFixed(2)})\n` +
      `Max Von Mises Stress:   ${maxVM.toFixed(1)} psi  at (x = ${locVM.x.toFixed(2)}, y = ${locVM.y.toFixed(2)})\n\n` +
      `Load Mode:              ${loadType}\n` +
      `Convergence:            N=${N} modes (${totalModes} series terms).`;

  } catch (err) {
    out.className = "results error-msg";
    out.innerText = `Runtime Error: ${err.message}\n${err.stack}`;
  }
}

// Initial UI setup
updateLoadUI();
</script>
